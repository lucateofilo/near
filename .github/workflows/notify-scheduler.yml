name: Notify Scheduler

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

# schedule: nativo + cron esterno su cron-job.org possono sovrapporsi: senza
# questo lock due esecuzioni concorrenti leggevano entrambe notifiedToPartner
# == false prima che una delle due scrivesse true, inviando il push due volte.
concurrency:
  group: notify-scheduler
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node scripts/notify-scheduler.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
